<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>머신 설정</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
<div class="bg-white p-8 rounded-lg shadow-lg w-96">
    <h2 class="text-2xl font-bold text-gray-700 text-center mb-6">머신 설정</h2>
    <form id="signup-form" class="space-y-4">
        <div><label for="userId" class="block text-sm font-medium text-gray-600 mb-1">아이디</label><input type="text" id="userId" class="w-full px-4 py-2 border border-gray-300 rounded-lg text-sm" required></div>
        <div><label for="password" class="block text-sm font-medium text-gray-600 mb-1">비밀번호</label><input type="password" id="password" class="w-full px-4 py-2 border border-gray-300 rounded-lg text-sm" required></div>
        <div><label for="ipAddress" class="block text-sm font-medium text-gray-600 mb-1">IP 주소</label><input type="text" id="ipAddress" class="w-full px-4 py-2 border border-gray-300 rounded-lg text-sm" required></div>
        <div><label for="storeName" class="block text-sm font-medium text-gray-600 mb-1">매장명</label><input type="text" id="storeName" class="w-full px-4 py-2 border border-gray-300 rounded-lg text-sm" required></div>
        <div><label for="tel" class="block text-sm font-medium text-gray-600 mb-1">매장 전화번호</label><input type="text" id="tel" class="w-full px-4 py-2 border border-gray-300 rounded-lg text-sm" required></div>
        <button type="submit" class="w-full bg-blue-500 text-white py-2 px-4 rounded-lg font-semibold">신규 매장 등록</button>
        <button type="button" id="LoginButton" class="w-full bg-blue-500 text-white py-2 px-4 rounded-lg font-semibold">로그인</button>
    </form>
</div>
<script src="index.js"></script>
</body>
</html>
